[project]
name = "cool-compression"
version = "0.1.0"
description = "CCP for every file on every machine!"
requires-python = ">=3.14"
dependencies = [
    "click==8.5.0",
    "numpy==2.5.3",
    "scikit-learn==1.9.0",
    "tqdm==4.70.0",
    "cccp-file-loader",
    "cccp_vle",
    "matplotlib>=3.11.1",
]


# -----------------------------------------------------------
# | handle CUDA/ROCm/CPU torch using sync flags             |
# | EXAMPLE: 'uv sync --extra cpu' will use CPU torch wheel |
# -----------------------------------------------------------

[project.optional-dependencies]
cpu = [ "torch>=2.11.0", "triton>=3.6.0" ]
cuda = [ "torch>=2.11.0", "triton>=3.6.0" ]
rocm = [ "torch>=2.11.0", "triton-rocm>=3.6.0" ]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "rocm" },
    ]
]
# ignore torch dependencies, as we supply torch through the extra indeces
exclude-dependencies = [
    { package = { name = 'mamba-ssm' }, dependencies = ['torch'] }
]

[tool.uv.sources]
cccp-file-loader = { path = "cccp/cccp_file_loader" }
cccp_vle = { path = "cccp/cccp_vle" }

torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm" }
]
triton = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
